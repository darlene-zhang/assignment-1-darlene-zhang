<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <!-- Roboto font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="main-header">

        <button class="menu-button" type="button" aria-label="Open menu">
            <img src="assets/menu_icon.png" alt="">
        </button>

        <div class="search-container">
            <img src="assets/search_icon.png" alt="" class="search-icon">
            <input
                type="text"
                class="search-input"
                placeholder="Quick find"
                aria-label="Quick find"
            >
        </div>

        <div class="task-counter">
            <img src="assets/check_icon.png" alt="">
            <span>30/5</span>
        </div>

    </header>


    <div class="page-layout">

        <nav class="sidebar" aria-label="Task categories">

            <ul class="navigation-list">

                <li class="navigation-item active">
                    <a href="#">
                        <img src="assets/inbox_icon.png" alt="">
                        <span>Inbox</span>
                        <span class="task-count">5</span>
                    </a>
                </li>

                <li class="navigation-item">
                    <a href="#">
                        <img src="assets/calendar_icon.png" alt="">
                        <span>Today</span>
                        <span class="task-count">5</span>
                    </a>
                </li>

                <li class="navigation-item">
                    <a href="#">
                        <img src="assets/upcoming_icon.png" alt="">
                        <span>Upcoming</span>
                    </a>
                </li>

            </ul>

        </nav>


        <main class="main-content">

            <section class="task-section">

                <h1>Inbox</h1>

                <ul class="task-list">

                    <li class="task-item">
                        <input type="checkbox" id="task1">
                        <label for="task1">Call Mom</label>
                    </li>

                    <li class="task-item">
                        <input type="checkbox" id="task2">
                        <label for="task2">
                            Buy the new issue of Scientific American
                        </label>
                    </li>

                    <li class="task-item">
                        <input type="checkbox" id="task3">
                        <label for="task3">
                            Return the textbook to Josie
                        </label>
                    </li>

                    <li class="task-item">
                        <input type="checkbox" id="task4">
                        <label for="task4">
                            Buy the new album by Rake
                        </label>
                    </li>

                    <li class="task-item">
                        <input type="checkbox" id="task5">
                        <label for="task5">
                            Buy a gift card for Dad
                        </label>
                    </li>

                </ul>

            </section>

        </main>

    </div>

</body>
</html>
